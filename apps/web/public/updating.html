<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cashier</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      main {
        width: 80%;
        text-align: center;
      }
      progress {
        width: 100%;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Shown by the desktop shell while it installs a newer Cashier version. -->
    <main>
      <p>جارٍ تحديث كاشير… سيُعاد فتحه تلقائيًا.</p>
      <progress id="progress"></progress>
    </main>
    <script>
      window.cashierProgress = (percent) => {
        document.getElementById("progress").value = percent / 100;
      };
    </script>
  </body>
</html>
